<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>Vue.js のサンプル</title>
    <script src="https://unpkg.com/vue@3.5.0/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios@1.7.0/dist/axios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.js"></script>
</head>

<body>
    <div id="app">
        <qiita-item></qiita-item>
    </div>
    <script>
        const app = Vue.createApp({});

        app.component('qiita-item', {
            data: () => ({
                items: null,
                keyword: '',
                message: ''
            }),
            watch: {
                keyword: function (newKeyword, oldKeyword) {
                    console.log(newKeyword)
                    this.message = '入力待ち...'
                    console.log(this.message)
                    this.debouncedGetAnswer()
                }
            },
            mounted: function () {
                this.debouncedGetAnswer = _.debounce(this.getAnswer, 1000)
            },
            methods: {
                getAnswer: function () {
                    if (this.keyword === '') {
                        console.log('入力なし')
                        this.items = null
                        return
                    }
                    this.message = 'loading...'
                    const vm = this
                    const params = { page: 1, per_page: 20, query: this.keyword }
                    axios.get('https://qiita.com/api/v2/items', { params })
                        .then(function (response) {
                            vm.items = response.data;
                        })
                        .catch(function (error) {
                            vm.message = 'Error!' + error
                        })
                        .finally(function () {

                        })
                }
            },
            template: `
                <h1>Vue3</h1>
                <div>
                    <p>
                        <input type="text" v-model="keyword">
                   </p>
                    <ul>
                    <li v-for="item in items">
                        <a v-bind:href="item.url" target="_blank">
                           {{ item.title }}                
                        </a>
                        likes: {{ item.likes_count }}
                    </li>
                    </ul>
                </div>
            `
        },
        );
        app.mount('#app')
    </script>
</body>

</html>
